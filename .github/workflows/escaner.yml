name: Escáner de señales

# Cada ejecución vigila el mercado cada 5 minutos durante unas 5 h (L-V de 8:00 a 22:00, hora de Madrid)
# y al terminar lanza la siguiente. La programación de abajo solo sirve para arrancar la cadena
# por la mañana o recuperarla si se corta: si ya hay una vigilando, la nueva espera su turno.
on:
  schedule:
    - cron: "4,19,34,49 4-20 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["escaner/**", ".github/workflows/escaner.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: escaner
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vigilar el mercado cada 5 minutos
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I escaner/vigilar.py
      - name: Pedir el relevo
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I escaner/vigilar.py relevo

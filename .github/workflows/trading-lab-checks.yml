name: Validar laboratorio de trading
on:
  pull_request:
    paths: ['trading-lab/**', '.agents/skills/trading-*/**', '.github/workflows/trading-lab-checks.yml']
  push:
    paths: ['trading-lab/**', '.agents/skills/trading-*/**', '.github/workflows/trading-lab-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: trading-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Probar simulador y persistencia
        run: node --test tests/*.test.mjs
      - name: Probar motor histórico
        run: python3 -m unittest discover -s research -v
      - name: Probar validación y calidad de datos
        run: python3 -m unittest discover -s validation -p 'test_*.py' -v
      - name: Comprobar paquete
        run: |
          node build.mjs
          node --check dist/server/index.js
